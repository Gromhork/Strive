# Release pipeline (see docs/ci-release.md).
#
#  * Push a version tag vX.Y.Z  -> version check (seconds) -> CI checks -> signed release APK + AAB -> GitHub Release
#                                  (notes = commits since the previous v* tag).
#  * "Run workflow" (manual)    -> optional CI checks -> test APK as a workflow artifact only.
#
# Versioning: versionName (--build-name) = tag without the leading "v"; it must equal the
# version name in pubspec.yaml, otherwise the run fails. versionCode (--build-number) =
# github.run_number of this workflow (+ BUILD_NUMBER_OFFSET), so it always increases.
#
# Signing: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
# ANDROID_KEY_ALIAS -> android/key.properties is written at build time (never committed).
# Without these secrets the build falls back to the debug key and every asset name carries
# "unsigned-debug".
name: Release

on:
  push:
    # Only tags that start like a version (v1..., v2...). Other tags such as "very-old" never
    # start this workflow; the exact format is checked by the "version" job.
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip analyze + tests (faster test APK)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer manual test build replaces an older one; tag builds always finish.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  FLUTTER_VERSION: '3.29.3'
  JAVA_VERSION: '21'
  # Raise this if the workflow is ever renamed/recreated (run_number restarts at 1) so
  # versionCode keeps increasing.
  BUILD_NUMBER_OFFSET: '0'

jobs:
  # Runs first and only reads pubspec.yaml, so a wrong tag fails within seconds instead of
  # after the full test suite.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          pub_full=$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n1)
          pub_name=${pub_full%%+*}
          if [ -z "$pub_name" ]; then
            echo "::error file=pubspec.yaml::No 'version:' line found in pubspec.yaml."
            exit 1
          fi
          build_number=$((RUN_NUMBER + BUILD_NUMBER_OFFSET))
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            name="${tag#v}"
            if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$tag' is not a version tag. Expected vMAJOR.MINOR.PATCH, e.g. v1.2.0 (optionally v1.2.0-beta.1)."
              exit 1
            fi
            if [ "$name" != "$pub_name" ]; then
              echo "::error file=pubspec.yaml::Tag $tag does not match pubspec.yaml version '$pub_full' (expected 'version: $name+...'). Bump the version in pubspec.yaml, commit, push, then delete and re-create the tag (see docs/ci-release.md)."
              exit 1
            fi
            label="$tag"
          else
            tag=""
            name="$pub_name"
            label="v${name}-test-${GITHUB_SHA::7}"
          fi
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "number=$build_number"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          echo "versionName=$name, versionCode=$build_number ($label)" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: CI checks
    needs: version
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Android
    needs: [version, checks]
    # Also run when the checks were skipped on purpose (manual build with skip_tests).
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      artifact: ${{ steps.assets.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      # android/gradle.properties contains Windows-only settings of the owner's PC
      # (org.gradle.java.home=C:/..., trustStoreType=Windows-ROOT for the local TLS interception).
      # Properties in ~/.gradle/gradle.properties take precedence over the project file, so they
      # are overridden here for the Linux runner without touching the repo.
      - name: Gradle settings for the Linux runner
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "org.gradle.java.home=$JAVA_HOME"
            echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"
          } > "$HOME/.gradle/gradle.properties"
          cat "$HOME/.gradle/gradle.properties"

      - name: Release signing from secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          present=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -n "${!v}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning::No signing secrets configured - building with the DEBUG key. Assets are named '...-unsigned-debug'. See docs/ci-release.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "::error::Only $present of 4 signing secrets are set. Need ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS (or none of them for a debug build)."
            exit 1
          fi
          # storeFile is resolved relative to android/app (file() in app/build.gradle.kts).
          # *.jks and key.properties are git-ignored.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
          # Opens the keystore and reads the key like the Android Gradle plugin does, so a wrong
          # password/alias or a broken keystore fails here with a clear message instead of as an
          # obscure Gradle signing error (keytool ignores -keypass for PKCS12 keystores).
          java .github/scripts/CheckKey.java android/app/upload-keystore.jks
          # Gradle reads key.properties with java.util.Properties (ISO-8859-1, backslash escapes,
          # leading blanks dropped). Values are escaped like Properties.store() does (backslash,
          # blanks, = : # !, control characters, non-ASCII as \uXXXX), so passwords may contain
          # any character.
          python3 .github/scripts/write_key_properties.py android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.number }}
        run: flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Build App Bundle (tags only)
        if: needs.version.outputs.tag != ''
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.number }}
        run: flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Verify signature and collect assets
        id: assets
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$SIGNED" != "true" ]; then suffix="-unsigned-debug"; fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs" | grep -E 'certificate (DN|SHA-256 digest)' || true
          if [ "$SIGNED" = "true" ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::Release key was configured but the APK is signed with the debug key."
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/strive-${LABEL}${suffix}.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/strive-${LABEL}${suffix}.aab"
          fi
          (cd dist && shopt -s nullglob && sha256sum -- *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "artifact=strive-${LABEL}${suffix}" >> "$GITHUB_OUTPUT"
          { echo '```'; ls -la dist; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.assets.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          {
            if [ "$SIGNED" != "true" ]; then
              echo "> **Achtung:** mit dem Debug-Schlüssel signiert (unsigned-debug) – nur zum Testen."
              echo "> Für signierte Builds die Signing-Secrets setzen (docs/ci-release.md)."
              echo
            fi
            if [ -n "$prev" ]; then
              echo "## Änderungen seit $prev"
              range="$prev..$TAG"
            else
              echo "## Änderungen"
              range="$TAG"
            fi
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
            if [ -n "$prev" ]; then
              echo
              echo "**Alle Änderungen:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            fi
          } > notes.md
          cat notes.md

          title="Strive $TAG"
          if [ "$SIGNED" != "true" ]; then title="$title (unsigned-debug)"; fi
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi

          shopt -s nullglob
          assets=(dist/*.apk dist/*.aab dist/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run for the same tag: replace the assets and refresh title/notes.
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease="$prerelease"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$title" --notes-file notes.md --prerelease="$prerelease"
          fi
